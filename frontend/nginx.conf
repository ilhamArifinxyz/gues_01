# =====================================================================
# TAHAP 5 DEPLOYMENT - KONFIGURASI NGINX FRONTEND SPA & REVERSE PROXY
# Sistem Manajemen Absensi Berbasis Web (Kelompok 10 RPL Univ Tadulako)
# =====================================================================

server {
    # Dengarkan pada Port 80 (HTTP Standar) dan Port 3000 (Alternatif Web)
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;

    server_name localhost;

    # Lokasi berkas produksi statis React Vite
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Pengaturan batas ukuran payload upload dokumen izin & foto selfie (25MB)
    client_max_body_size 25M;

    # Header keamanan standar industri
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Optimasi Kompresi Gzip untuk mempercepat pengiriman aset ke browser
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 1. Reverse Proxy ke Backend Go Chi API (/api/v1/)
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_http_version 1.1;

        # Header forwarding standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan websocket jika diperlukan
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Konfigurasi timeout reverse proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Reverse Proxy untuk Akses Berkas Unggahan Gambar Bukti Presensi
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Health Check proxy untuk kemudahan monitoring status
    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 4. Caching Aset Statis Vite (JS, CSS, Gambar, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. Routing React SPA: Fallback seluruh route ke index.html (HTML5 History API)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Halaman error khusus
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
